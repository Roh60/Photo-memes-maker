name: Build Photo and Memes Maker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Prepare Android SDK path
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -f gradle.properties ]; then
            sed -i '/^android\.aapt2FromMavenOverride=/d' gradle.properties
          fi

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Block removed promotional claims
        shell: bash
        run: |
          set +e
          git grep -n -I -E 'Pro Studio feature enabled|Pro Studio|Unlimited 100% HD export|Unlimited HD exports|100% offline|offline & private' -- app/src
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then
            echo "ERROR: Removed promotional claims found in app source."
            exit 1
          elif [ "$result" -ne 1 ]; then
            echo "ERROR: Source scan failed with exit code $result."
            exit "$result"
          fi
          echo "PASS: No removed promotional claims in tracked app source."

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: photo-memes-maker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
